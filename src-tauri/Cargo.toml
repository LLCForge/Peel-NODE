[package]
name = "peel-desktop"
version = "0.1.0"
description = "PEEL: JavaScript deobfuscator masaüstü sürümü (Tauri)"
authors = ["LLCForge"]
license = "MIT"
repository = "https://github.com/LLCForge/Peel-JS"
edition = "2021"
rust-version = "1.90"

[lib]
name = "peel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
